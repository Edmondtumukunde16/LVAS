
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LVAS | Sign In</title>

    <link rel="stylesheet" href="style1.css">

</head>

<body>

    <h1 style="text-align:center;font-size:30px;margin-bottom:15px;">
        <strong>LECTURE VERIFICATION AND ATTENDANCE SYSTEM</strong>
    </h1>

    <p class="subtitle" style="text-align:center;">
        Secure.Simple.Reliable
    </p>


    <nav style="display:flex;justify-content:center;gap:25px;margin-bottom:35px;">

        <a href="index.html">Home</a>

        <a href="Fourth.html">Dashboard</a>

    </nav>


    <!-- SIGN-IN CARD -->

    <form class="signin-card" id="signInForm">

        <h2 style="text-align:center;margin-top:35px;margin-bottom:15px;">
            SIGN IN
        </h2>

        <label for="name">NAME</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <br>

        <label for="accessNumber">Access Number</label>

        <input
            type="text"
            id="accessNumber"
            placeholder="Enter your access number"
            required
        >

        <br>

        <button type="submit" style="padding:5px 15px;">
            SCAN FACE
        </button>

        <p id="loginMessage"></p>

    </form>


    <!-- JAVASCRIPT -->

    <script>

        // STUDENT DATASET

        const students = [

            { name: "TUMUKUNDE EDMOND", accessNumber: "B001" },
            { name: "KIYIMBA JOSEPH", accessNumber: "B002" },
            { name: "ARIHO ADRIANO", accessNumber: "B003" },
            { name: "BORIS LUYOMBYA", accessNumber: "B004" },
            { name: "ASHABA IAN", accessNumber: "B005" },
            { name: "LEKOBA ETHAN", accessNumber: "B006" },
            { name: "EBWE JOSHUA LASURU", accessNumber: "B007" },
            { name: "GLENN TWESIIME", accessNumber: "B008" }

        ];


        // LECTURER DATASET

        const lecturers = [

            { name: "MR ROBERT", accessNumber: "L1001" },
            { name: "MR KENT", accessNumber: "L1002" }

        ];


        // SIGN-IN FORM

        document.getElementById("signInForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim().toUpperCase();

            const accessNumber = document.getElementById("accessNumber").value.trim().toUpperCase();

            const message = document.getElementById("loginMessage");


            // CHECK STUDENT DETAILS

            const student = students.find(function(s) {

                return s.name === name &&
                       s.accessNumber === accessNumber;

            });


            // CHECK LECTURER DETAILS

            const lecturer = lecturers.find(function(l) {

                return l.name === name &&
                       l.accessNumber === accessNumber;

            });


            // STUDENT FLOW

            if (student) {

                sessionStorage.setItem(
                    "verifiedStudent",
                    JSON.stringify(student)
                );


                // GET EXISTING ATTENDANCE RECORDS

                let attendanceRecords = JSON.parse(
                    localStorage.getItem("lvasAttendance") || "[]"
                );


                // GET TODAY'S DATE

                const today = new Date().toLocaleDateString("en-GB");


                // CHECK IF STUDENT HAS ALREADY SIGNED IN TODAY

                const existingRecord = attendanceRecords.find(function(record) {

                    return record.accessNumber === student.accessNumber &&
                           record.date === today;

                });


                // GET CURRENT TIME

                const currentTime = new Date().toLocaleTimeString("en-GB");


                // SAVE OR UPDATE ATTENDANCE

                if (!existingRecord) {

                    const newRecord = {

                        name: student.name,
                        accessNumber: student.accessNumber,
                        date: today,
                        time: currentTime,
                        location: "UCU Main Campus",
                        status: "Present"

                    };

                    attendanceRecords.push(newRecord);

                } else {

                    // UPDATE EXISTING RECORD IF DETAILS ARE MISSING

                    if (!existingRecord.time) {

                        existingRecord.time = currentTime;

                    }

                    if (!existingRecord.location) {

                        existingRecord.location = "UCU Main Campus";

                    }

                }


                // SAVE ATTENDANCE RECORDS

                localStorage.setItem(
                    "lvasAttendance",
                    JSON.stringify(attendanceRecords)
                );


                message.style.color = "green";

                message.textContent =
                    "Student recognized! Proceeding to face verification...";


                setTimeout(function() {

                    window.location.href = "face.html";

                }, 2000);

            }


            // LECTURER FLOW

            else if (lecturer) {

                sessionStorage.setItem(
                    "verifiedLecturer",
                    JSON.stringify(lecturer)
                );


                message.style.color = "green";

                message.textContent =
                    "Lecturer recognized! Opening lecturer portal...";


                setTimeout(function() {

                    window.location.href = "Qr.html";

                }, 2000);

            }


            // INVALID DETAILS

            else {

                message.style.color = "red";

                message.textContent =
                    "Access denied! Details not found.";

            }

        });

    </script>


    <!-- FOOTER -->

    <footer style="text-align:center;color:red;padding:15px;width:100%;">

        <p>Copyright &copy; 2026 LVAS, All rights reserved.</p>

    </footer>

</body>

</html>
